# resolvezero-console — hosted control plane at my.resolvezero.com
app = "resolvezero-console"
primary_region = "fra" # same region group as the eu-central-2 PlanetScale DB
kill_signal = "SIGTERM"
kill_timeout = 20

[build]
  dockerfile = "apps/console/Dockerfile"

[deploy]
  strategy = "bluegreen"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
