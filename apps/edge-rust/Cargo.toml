[package]
name = "resolvezero-edge"
version = "0.1.0"
edition = "2021"
description = "ResolveZero DNS edge — Rust rewrite of apps/edge (WIP, not deployed)"
license = "MIT"

[dependencies]
axum = "0.7"
base64 = "0.22"
bytes = "1"
hickory-proto = "0.26"
flate2 = "1"
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.11"
subtle = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
