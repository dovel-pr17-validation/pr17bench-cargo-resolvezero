app = "resolvezero-edge-rust"
primary_region = "fra"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.edge-rust"

[deploy]
  strategy = "immediate"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[env]
  PORT = "8080"
  DNS_PORT = "53"
  DOT_PORT = "853"
  METRICS_PORT = "9091"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"
    method = "GET"
    path = "/readyz"

[metrics]
  port = 9091
  path = "/metrics"

[[services]]
  protocol = "tcp"
  internal_port = 53
  [[services.ports]]
    port = 53
    handlers = ["proxy_proto"]
  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"

[[services]]
  protocol = "udp"
  internal_port = 53
  [[services.ports]]
    port = 53

[[services]]
  protocol = "tcp"
  internal_port = 853
  [[services.ports]]
    port = 853
    handlers = ["tls", "proxy_proto"]
    proxy_proto_options = { version = "v2" }
    tls_options = { versions = ["TLSv1.2", "TLSv1.3"] }
